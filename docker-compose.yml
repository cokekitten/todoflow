services:
  todoflow:
    build:
      context: .
      dockerfile: Dockerfile
    image: todoflow:latest
    container_name: todoflow
    restart: unless-stopped
    ports:
      - "3916:3916"
    environment:
      NODE_ENV: production
      APP_ENV: production
      PORT: "3916"
      CRON_SECRET: ${CRON_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - todoflow-data:/app/data
  mcp:
    image: todoflow:latest
    container_name: todoflow-mcp
    restart: unless-stopped
    depends_on:
      - todoflow
    command: ["npm", "run", "mcp:start:http"]
    environment:
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "3917"
      TODOFLOW_BASE_URL: http://todoflow:3916
      TODOFLOW_NO_AUTH_ONLY: "true"
      TODOFLOW_TIMEOUT_MS: "8000"
      TODOFLOW_CRON_SECRET: ${CRON_SECRET:-}
    ports:
      - "3917:3917"

volumes:
  todoflow-data:
